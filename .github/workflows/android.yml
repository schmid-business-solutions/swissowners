name: Android-App

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signierschlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 fehlt – es wird nur eine Testversion gebaut."
          fi

      - name: App bauen
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p ../dist
          if [ "$SIGNED" = "1" ]; then
            ./gradlew --no-daemon -PversionCode=${{ github.run_number }} assembleRelease bundleRelease
            cp app/build/outputs/apk/release/app-release.apk ../dist/SwissOwners.apk
            cp app/build/outputs/bundle/release/app-release.aab ../dist/SwissOwners-PlayStore.aab
          else
            ./gradlew --no-daemon -PversionCode=${{ github.run_number }} assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../dist/SwissOwners-Testversion.apk
          fi
          rm -f release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: swissowners-android-${{ github.run_number }}
          path: dist/*

      - name: Als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-1.0.${{ github.run_number }}"
          if [ "$SIGNED" = "1" ]; then
            gh release create "$TAG" dist/* --target "${{ github.sha }}" \
              --title "SwissOwners Android 1.0.${{ github.run_number }}" \
              --notes "APK zum direkten Installieren, AAB für den Google Play Store."
          else
            gh release create "$TAG" dist/* --target "${{ github.sha }}" --prerelease \
              --title "SwissOwners Android 1.0.${{ github.run_number }} (Testversion)" \
              --notes "Testversion ohne festen Signierschlüssel: Adressleiste sichtbar, Updates erfordern Neuinstallation."
          fi
